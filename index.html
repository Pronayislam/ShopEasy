<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ShopEase</h1>

        <nav>
            <a href="#cart-section">
                Cart 🛒 (<span id="nav-cart-count">0</span>)
            </a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to ShopEase</h2>
        <p>Discover amazing products at the best prices.</p>
        <a href="#product-list" class="btn">Shop Now</a>
    </section>

    <section class="products">

        <h2>Our Products</h2>

        <div class="filter-container">

            <input
                type="text"
                id="search-input"
                placeholder="Search products..."
            >

            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
            </select>

            <select id="sort-select">
                <option value="default">Sort by: Default</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name: A to Z</option>
            </select>

        </div>

        <div id="product-list"></div>

    </section>

    <section class="cart-section" id="cart-section">
        <h2>Shopping Cart</h2>

        <p>Cart Items: <span id="cart-count">0</span></p>

        <div id="cart-items"></div>

        <h3>Total: ৳ <span id="cart-total">0</span></h3>

        <button id="checkout-btn">Checkout</button>
        <button id="clear-cart">Clear Cart</button>
    </section>

    <!-- Product Details Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" data-close-modal>&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" data-close-checkout>&times;</span>

            <h2>Checkout</h2>
            <p class="checkout-total">Total: ৳ <span id="checkout-total">0</span></p>

            <form id="checkout-form" novalidate>

                <div class="form-group">
                    <label for="customer-name">Full Name</label>
                    <input type="text" id="customer-name" placeholder="Your name">
                    <small class="error" id="customer-name-error"></small>
                </div>

                <div class="form-group">
                    <label for="customer-phone">Phone Number</label>
                    <input type="text" id="customer-phone" placeholder="01XXXXXXXXX">
                    <small class="error" id="customer-phone-error"></small>
                </div>

                <div class="form-group">
                    <label for="customer-address">Address</label>
                    <textarea id="customer-address" rows="3" placeholder="House, road, area, city"></textarea>
                    <small class="error" id="customer-address-error"></small>
                </div>

                <button type="submit">Place Order</button>
            </form>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
